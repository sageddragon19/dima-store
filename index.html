<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dima - أزياء وعبايات</title>
<meta name="description" content="Dima - أزياء حريمي وعبايات في بورسعيد. اطلبي أونلاين عبر واتساب.">
<meta name="theme-color" content="#171214">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f5; --card:#fff; --ink:#1d1819; --muted:#8a8279;
  --dark:#171214; --gold:#b08d57; --gold2:#d8bf8c; --line:#e9e3da;
  --serif:'Cormorant Garamond','Amiri',serif; --ar:'Amiri','Cairo',serif; --sans:'Cairo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
svg{display:block}
button{font-family:inherit}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(250,248,245,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 14px}
.top .r{justify-self:start}
.top .l{justify-self:end}
.ib{position:relative;background:none;border:0;color:var(--ink);width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.logo{direction:ltr;font-family:var(--serif);font-weight:600;font-size:1.65rem;letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.badge{position:absolute;top:3px;left:2px;background:var(--gold);color:#fff;font-size:.66rem;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;transition:transform .2s}

/* ---------- Hero ---------- */
.hero{position:relative;text-align:center;color:#f3ece0;padding:88px 24px 96px;background:radial-gradient(ellipse at 50% 0%,rgba(176,141,87,.25),transparent 62%),var(--dark)}
.hero .frame{position:absolute;inset:14px;border:1px solid rgba(216,191,140,.28);pointer-events:none}
.hero small{display:block;letter-spacing:.34em;text-transform:uppercase;color:var(--gold2);font-size:.68rem;margin-bottom:16px;font-weight:600;direction:ltr}
.hero h1{direction:ltr;font-family:var(--serif);font-weight:500;font-size:clamp(3.8rem,17vw,6.8rem);line-height:1;letter-spacing:.2em;padding-left:.2em;text-transform:uppercase}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 20px;width:170px}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.orn i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.hero p{font-family:var(--ar);font-size:1.15rem;color:#e6dccb;max-width:440px;margin:0 auto 30px}
.cta{display:inline-block;border:1px solid var(--gold2);color:var(--gold2);text-decoration:none;padding:11px 38px;letter-spacing:.08em;font-size:.92rem;font-weight:600;transition:.25s}
.cta:hover{background:var(--gold2);color:var(--dark)}

/* ---------- Perks ---------- */
.perks{display:flex;justify-content:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line)}
.perks div{display:flex;align-items:center;gap:9px;padding:14px 20px;font-size:.84rem;color:var(--ink)}
.perks div svg{color:var(--gold)}

/* ---------- Collection ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:46px 14px 20px}
.sec{text-align:center;margin-bottom:22px}
.sec small{display:block;color:var(--gold);letter-spacing:.3em;font-size:.68rem;font-weight:600;direction:ltr}
.sec h2{font-family:var(--ar);font-size:2.1rem;font-weight:700;line-height:1.3}
.sbox{position:relative;max-width:320px;margin:0 auto 22px}
.sbox svg{position:absolute;top:50%;right:2px;transform:translateY(-50%);color:var(--muted)}
.sbox input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 30px 8px 4px;font:inherit;font-size:.92rem;outline:none;transition:border-color .2s}
.sbox input:focus{border-color:var(--gold)}
.filters{display:flex;justify-content:center;gap:4px 22px;flex-wrap:wrap;margin-bottom:28px}
.filters button{background:none;border:0;border-bottom:1px solid transparent;padding:4px 2px;font-size:.95rem;cursor:pointer;color:var(--muted);transition:.2s}
.filters button:hover{color:var(--ink)}
.filters button.on{color:var(--ink);border-color:var(--gold);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);gap:34px 20px}}
.card{display:flex;flex-direction:column;animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.thumb{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:zoom-in;background:#efe9e0}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .thumb img{transform:scale(1.05)}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:rgba(50,38,34,.55)}
.ph b{font-family:var(--serif);font-style:italic;font-weight:500;font-size:4.2rem;line-height:1}
.ph span{font-size:.72rem;letter-spacing:.16em;margin-top:6px}
.tag{position:absolute;top:0;right:0;background:var(--dark);color:var(--gold2);font-size:.68rem;padding:2px 12px;letter-spacing:.06em;font-weight:600}
.sold{position:absolute;inset:0;background:rgba(250,248,245,.78);display:flex;align-items:center;justify-content:center;font-family:var(--ar);font-size:1.15rem;color:var(--ink)}
.info{padding-top:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:.92rem;font-weight:600;line-height:1.4}
.price{font-family:var(--serif),var(--sans);font-weight:700;font-size:1.2rem;color:var(--ink)}
.price s{color:var(--muted);font-weight:500;font-size:.88rem;margin-right:8px}
.sizes{display:flex;gap:5px;flex-wrap:wrap}
.sizes button{border:1px solid var(--line);background:#fff;min-width:30px;height:27px;padding:0 8px;font-size:.76rem;cursor:pointer;color:var(--ink);transition:.15s}
.sizes button:hover{border-color:var(--ink)}
.sizes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.add{margin-top:auto;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px;font-size:.86rem;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:.2s}
.add:hover{background:var(--ink);color:#fff}
.add:disabled{border-color:var(--line);color:#b9b2a9;background:transparent;cursor:not-allowed}
.msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px;font-family:var(--ar);font-size:1.1rem}

/* ---------- Cart ---------- */
.overlay{position:fixed;inset:0;background:rgba(23,18,20,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,100%);background:var(--bg);z-index:40;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 18px;border-bottom:1px solid var(--line);font-family:var(--ar);font-size:1.3rem;font-weight:700}
.items{flex:1;overflow:auto;padding:4px 18px}
.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row .im{width:58px;height:74px;flex:none;background-size:cover;background-position:center}
.row .t{flex:1;font-size:.88rem;font-weight:600;line-height:1.4}
.row small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.qty{display:flex;align-items:center;border:1px solid var(--line);background:#fff}
.qty button{width:28px;height:28px;border:0;background:none;cursor:pointer;font-size:1rem;color:var(--ink)}
.qty span{min-width:20px;text-align:center;font-size:.88rem}
.foot{padding:16px 18px 20px;border-top:1px solid var(--line);background:#fff}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.total span:first-child{font-family:var(--ar);font-size:1.15rem}
.total span:last-child{font-family:var(--serif),var(--sans);font-size:1.5rem;font-weight:700}
.foot input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px;font:inherit;font-size:.92rem;margin-bottom:8px;outline:none}
.foot input:focus{border-color:var(--gold)}
.wa{width:100%;margin-top:8px;background:var(--dark);color:var(--gold2);border:0;padding:14px;font-size:.98rem;font-weight:600;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.wa:active{opacity:.9}
.empty{text-align:center;color:var(--muted);padding:70px 0;font-family:var(--ar);font-size:1.15rem}

/* ---------- Zoom ---------- */
.zoom{position:fixed;inset:0;background:rgba(23,18,20,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.zoom.open{display:flex}
.zoom img{max-width:100%;max-height:92vh}
.zoom .box{width:min(340px,88vw);aspect-ratio:3/4}

/* ---------- Footer ---------- */
footer{background:var(--dark);color:#cfc6b8;text-align:center;padding:50px 20px 100px;margin-top:50px}
footer .logo{color:#f3ece0;display:inline-block;font-size:1.9rem}
footer .orn{margin:16px auto 22px}
.fl{display:flex;align-items:flex-start;justify-content:center;gap:10px;margin:9px auto;max-width:520px;font-size:.92rem}
.fl svg{color:var(--gold2);flex:none;margin-top:3px}
.fl a{color:#f3ece0;text-decoration:none;border-bottom:1px solid rgba(216,191,140,.4)}
.social{display:flex;gap:12px;justify-content:center;margin-top:22px}
.social a{width:42px;height:42px;border:1px solid rgba(216,191,140,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold2);transition:.2s}
.social a:hover{background:var(--gold2);color:var(--dark)}
.copy{margin-top:30px;font-size:.74rem;color:#8c8478;letter-spacing:.06em}
.wa-float{position:fixed;bottom:18px;right:18px;background:var(--dark);color:var(--gold2);border:1px solid var(--gold);width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.28);z-index:15}
</style>
</head>
<body>

<header class="top">
  <a class="ib r" href="#products" aria-label="بحث" onclick="setTimeout(()=>document.getElementById('search').focus(),500)"><span data-ic="search" data-s="22"></span></a>
  <a class="logo" href="#" id="logo"></a>
  <button class="ib l" onclick="toggleCart(true)" aria-label="السلة"><span data-ic="bag" data-s="24"></span><b class="badge" id="count">0</b></button>
</header>

<section class="hero">
  <div class="frame"></div>
  <small id="heroSmall"></small>
  <h1 id="heroName"></h1>
  <div class="orn"><i></i></div>
  <p id="heroSub"></p>
  <a class="cta" href="#products">اكتشفي المجموعة</a>
</section>

<div class="perks" id="perks"></div>

<main class="wrap" id="products">
  <div class="sec"><small>THE COLLECTION</small><h2>المجموعة</h2></div>
  <div class="sbox"><span data-ic="search" data-s="18"></span><input id="search" type="search" placeholder="ابحثي عن قطعة..."></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"><div class="msg">جاري تحميل المجموعة...</div></div>
</main>

<footer>
  <a class="logo" href="#" id="flogo"></a>
  <div class="orn"><i></i></div>
  <div class="fl"><span data-ic="pin" data-s="19"></span><span id="fAddr"></span></div>
  <div class="fl" id="fHoursRow"><span data-ic="clock" data-s="19"></span><span id="fHours"></span></div>
  <div class="fl"><span data-ic="phone" data-s="19"></span><a id="fPhone"></a></div>
  <div class="social" id="social"></div>
  <p class="copy" id="copy"></p>
</footer>

<a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="واتساب"><span data-ic="whatsapp" data-s="28"></span></a>

<div class="overlay" id="ov" onclick="toggleCart(false)"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><span>حقيبة التسوق</span><button class="ib" onclick="toggleCart(false)" aria-label="إغلاق"><span data-ic="close" data-s="22"></span></button></div>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="total"><span>الإجمالي</span><span id="total">0</span></div>
    <input id="cname" placeholder="الاسم">
    <input id="caddr" placeholder="العنوان بالتفصيل">
    <button class="wa" onclick="checkout()"><span data-ic="whatsapp" data-s="20"></span>إتمام الطلب عبر واتساب</button>
  </div>
</aside>

<div class="zoom" id="zoom" onclick="this.classList.remove('open')"></div>

<script>
/* =====================================================================
   إعدادات المحل — دي الحاجات الوحيدة اللي بتتغير في الكود (مرة واحدة بس)
   ===================================================================== */
const SHOP = {
  name: "Dima",
  small: "Women's Fashion & Abayas",
  sub: "أزياء وعبايات بتصاميم راقية تناسب كل مناسبة",

  // رقم الواتساب بصيغة دولية بدون + وبدون صفر. مثال: 01012345678 تتكتب 201012345678
  phone: "201000000000",
  phoneShow: "0100 000 0000",

  address: "شارع الثلاثيني - برج Lindaa - بجوار مستشفى ابن سينا، بورسعيد",
  map: "https://maps.app.goo.gl/b27DusD3VNtsrf1G6",
  hours: "مواعيد العمل: يوميًا من 10 ص حتى 11 م",   // امسحي النص لو مش عايزينه

  instagram: "",   // حطي لينك صفحة الانستجرام هنا
  facebook: "",    // حطي لينك صفحة الفيسبوك هنا

  currency: "ج",
  // كل عنصر: [اسم الأيقونة, النص] — الأيقونات المتاحة: truck, cash, refresh
  perks: [["truck","توصيل لجميع المناطق"],["cash","الدفع عند الاستلام"],["refresh","استبدال خلال 3 أيام"]],

  // رابط جدول جوجل شيت (CSV) اللي فيه المنتجات. لو فاضي الموقع بيعرض المنتجات التجريبية اللي تحت
  sheetUrl: ""
};

/* منتجات تجريبية — بتظهر بس لو sheetUrl فاضي */
const SAMPLE = [
  ["عباية كريب سادة","عبايات",950,1100,"52,54,56","","جديد","نعم"],
  ["عباية مطرزة بالأكمام","عبايات",1350,0,"فري","","","نعم"],
  ["عباية خروج بحزام","عبايات",1100,1300,"52,54,56","","","نعم"],
  ["فستان سواريه طويل","فساتين",1450,1700,"S,M,L,XL","","","نعم"],
  ["فستان كاجوال صيفي","فساتين",650,0,"S,M,L","","جديد","نعم"],
  ["بلوزة ستان","بلوزات",380,450,"S,M,L","","","نعم"],
  ["تونيك شيفون","بلوزات",420,0,"M,L,XL","","","لا"],
  ["طقم بنطلون وجاكيت","أطقم",1200,0,"S,M,L,XL","","","نعم"],
  ["طرحة قطن حرير","طرح",180,0,"فري","","","نعم"],
  ["إيشارب شيفون مطبوع","طرح",150,200,"فري","","خصم","نعم"],
  ["شنطة كروس","إكسسوار",480,0,"فري","","","نعم"],
  ["طقم حلق وسلسلة","إكسسوار",220,0,"فري","","","نعم"]
];
/* ===================================================================== */

/* ---------- أيقونات ---------- */
const ICONS = {
  bag:'<path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  truck:'<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
  cash:'<rect x="3" y="6.5" width="18" height="11" rx="1.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v.01M17.5 14.5v.01"/>',
  refresh:'<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>',
  pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  instagram:'<rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17" cy="7" r=".7" fill="currentColor"/>',
  facebook:'<path d="M15 4h-2.5A3.5 3.5 0 0 0 9 7.5V10H6v4h3v7h4v-7h3l1-4h-4V7.5c0-.3.2-.5.5-.5H15z"/>',
  whatsapp:'<path fill="currentColor" stroke="none" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.3 5.3 0 0 0 1.100 2.800 12 12 0 0 0 4.600 4c1.700.7 2.400.8 3.200.7a2.700 2.700 0 0 0 1.800-1.300 2.200 2.200 0 0 0 .2-1.300c-.1-.1-.2-.2-.5-.3z"/>'
};
const ic = (n,s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`;
const paintIcons = root => (root||document).querySelectorAll("[data-ic]:not([data-done])").forEach(e=>{e.innerHTML=ic(e.dataset.ic,+e.dataset.s||20);e.dataset.done=1;});

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toEn = s => String(s||"").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
const fmt = n => n.toLocaleString("en-US") + " " + SHOP.currency;
const TINTS = [["#eadfd0","#cdb79c"],["#e8d6d6","#c6a2a6"],["#ddd9d0","#b2ab9b"],["#e0d4dd","#b9a2b5"],["#d6dfd8","#a8b9ac"],["#ecdcc6","#c9ad84"]];
const MONO = (SHOP.name||"D").trim().charAt(0).toUpperCase();

let PRODUCTS = [], cart = [], cat = "الكل", q = "", sel = {};

/* ---------- تجهيز بيانات الموقع ---------- */
$("logo").textContent = $("flogo").textContent = SHOP.name;
$("heroSmall").textContent = SHOP.small;
$("heroName").textContent = SHOP.name;
$("heroSub").textContent = SHOP.sub;
$("perks").innerHTML = SHOP.perks.map(p => `<div>${ic(p[0],20)}<span>${esc(p[1])}</span></div>`).join("");
$("fAddr").innerHTML = esc(SHOP.address) + (SHOP.map ? `<br><a href="${esc(SHOP.map)}" target="_blank" rel="noopener">افتحي الموقع على الخريطة</a>` : "");
if(SHOP.hours){ $("fHours").textContent = SHOP.hours; } else { $("fHoursRow").remove(); }
$("fPhone").textContent = SHOP.phoneShow;
$("fPhone").href = "tel:+" + SHOP.phone;
$("waFloat").href = "https://wa.me/" + SHOP.phone;
$("social").innerHTML =
  (SHOP.instagram ? `<a href="${esc(SHOP.instagram)}" target="_blank" rel="noopener" aria-label="Instagram">${ic("instagram",20)}</a>` : "") +
  (SHOP.facebook ? `<a href="${esc(SHOP.facebook)}" target="_blank" rel="noopener" aria-label="Facebook">${ic("facebook",20)}</a>` : "");
$("copy").textContent = "© " + new Date().getFullYear() + " " + SHOP.name.toUpperCase();
document.title = SHOP.name + " - أزياء وعبايات";
paintIcons();

/* ---------- قراءة الجدول ---------- */
function parseCSV(t){
  const rows=[]; let r=[], c="", inQ=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(inQ){
      if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++;} else inQ=false; } else c+=ch;
    } else if(ch=='"') inQ=true;
    else if(ch==","){ r.push(c); c=""; }
    else if(ch=="\n"||ch=="\r"){ if(ch=="\r"&&t[i+1]=="\n") i++; r.push(c); rows.push(r); r=[]; c=""; }
    else c+=ch;
  }
  if(c!==""||r.length){ r.push(c); rows.push(r); }
  return rows;
}
function imgUrl(u){
  u=(u||"").trim(); if(!u) return "";
  if(u.includes("drive.google.com")){
    const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);
    if(m) return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w800";
  }
  return u;
}
function toProduct(r,i){
  const price=parseFloat(toEn(r[2]).replace(/[^\d.]/g,""))||0;
  const old=parseFloat(toEn(r[3]).replace(/[^\d.]/g,""))||0;
  const sizes=(r[4]||"").split(/[,،\/]/).map(s=>s.trim()).filter(Boolean);
  const avail=!/^(لا|no|0|خلص|نفد|نفدت)/i.test((r[7]||"نعم").trim());
  return {id:i,name:(r[0]||"").trim(),cat:(r[1]||"أخرى").trim()||"أخرى",price,old:old>price?old:0,
          sizes:sizes.length?sizes:["فري"],img:imgUrl(r[5]),tag:(r[6]||"").trim(),avail};
}
async function load(){
  if(!SHOP.sheetUrl){ PRODUCTS=SAMPLE.map(toProduct); return; }
  try{
    const res=await fetch(SHOP.sheetUrl,{cache:"no-store"});
    if(!res.ok) throw 0;
    const rows=parseCSV(await res.text()).slice(1).filter(r=>r[0]&&r[0].trim());
    PRODUCTS=rows.map(toProduct);
    try{ localStorage.setItem("shop_cache",JSON.stringify(PRODUCTS)); }catch(e){}
  }catch(e){
    try{ PRODUCTS=JSON.parse(localStorage.getItem("shop_cache")||"[]"); }catch(_){ PRODUCTS=[]; }
  }
}

/* ---------- عرض المنتجات ---------- */
function phHTML(p){
  const t=TINTS[p.id%TINTS.length];
  return `<div class="ph" style="background:linear-gradient(165deg,${t[0]},${t[1]})"><b>${esc(MONO)}</b><span>${esc(p.cat)}</span></div>`;
}
function renderFilters(){
  const cats=["الكل",...new Set(PRODUCTS.map(p=>p.cat))];
  $("filters").innerHTML=cats.map((c,i)=>`<button class="${c===cat?'on':''}">${esc(c)}</button>`).join("");
  $("filters").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{cat=cats[i];renderFilters();renderGrid();});
}
function renderGrid(){
  if(!PRODUCTS.length){ $("grid").innerHTML=`<div class="msg">تعذّر تحميل المجموعة حاليًا، تواصلي معنا عبر واتساب</div>`; return; }
  const list=PRODUCTS.filter(p=>(cat==="الكل"||p.cat===cat)&&(!q||(p.name+p.cat).includes(q)));
  if(!list.length){ $("grid").innerHTML=`<div class="msg">لا توجد قطع مطابقة</div>`; return; }
  $("grid").innerHTML=list.map((p,n)=>{
    const s=sel[p.id]||p.sizes[0];
    const disc=p.old?Math.round((1-p.price/p.old)*100):0;
    const tag=p.tag||(disc?`خصم ${disc}%`:"");
    return `<div class="card" style="animation-delay:${Math.min(n,8)*50}ms">
      <div class="thumb" onclick="zoom(${p.id})">
        ${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=phHTML(PRODUCTS[${p.id}])">`:phHTML(p)}
        ${tag?`<span class="tag">${esc(tag)}</span>`:""}
        ${p.avail?"":`<div class="sold">نفدت الكمية</div>`}
      </div>
      <div class="info">
        <h3>${esc(p.name)}</h3>
        <div class="price">${fmt(p.price)}${p.old?`<s>${fmt(p.old)}</s>`:""}</div>
        <div class="sizes">${p.sizes.map((z,i)=>`<button class="${z===s?'on':''}" onclick="pick(${p.id},${i})">${esc(z)}</button>`).join("")}</div>
        <button class="add" ${p.avail?"":"disabled"} onclick="add(${p.id})">${p.avail?"أضيفي للحقيبة":"غير متاح"}</button>
      </div></div>`;
  }).join("");
}
function pick(id,i){ sel[id]=PRODUCTS[id].sizes[i]; renderGrid(); }
function zoom(id){
  const p=PRODUCTS[id], z=$("zoom");
  z.innerHTML=p.img?`<img src="${esc(p.img)}" alt="" referrerpolicy="no-referrer">`:`<div class="box">${phHTML(p)}</div>`;
  z.classList.add("open");
}
$("search").oninput=e=>{q=e.target.value.trim();renderGrid();};

/* ---------- السلة ---------- */
function add(id){
  const p=PRODUCTS[id], size=sel[id]||p.sizes[0];
  const k=cart.find(c=>c.id===id&&c.size===size);
  k?k.q++:cart.push({id,size,q:1});
  renderCart();
  const b=$("count"); b.style.transform="scale(1.45)"; setTimeout(()=>b.style.transform="",220);
}
function change(i,d){ cart[i].q+=d; if(cart[i].q<=0) cart.splice(i,1); renderCart(); }
function renderCart(){
  let total=0,n=0;
  $("items").innerHTML=cart.length?cart.map((c,i)=>{
    const p=PRODUCTS[c.id]; total+=p.price*c.q; n+=c.q;
    const t=TINTS[p.id%TINTS.length];
    const bg=p.img?`background-image:url('${esc(p.img)}')`:`background:linear-gradient(165deg,${t[0]},${t[1]})`;
    return `<div class="row"><div class="im" style="${bg}"></div>
      <div class="t">${esc(p.name)}<small>المقاس: ${esc(c.size)} · ${fmt(p.price)}</small></div>
      <div class="qty"><button onclick="change(${i},-1)">−</button><span>${c.q}</span><button onclick="change(${i},1)">+</button></div></div>`;
  }).join(""):`<div class="empty">الحقيبة فارغة</div>`;
  $("total").textContent=fmt(total);
  $("count").textContent=n;
}
function toggleCart(o){ $("drawer").classList.toggle("open",o); $("ov").classList.toggle("open",o); }
function checkout(){
  if(!cart.length) return alert("الحقيبة فارغة");
  const name=$("cname").value.trim(), addr=$("caddr").value.trim();
  if(!name||!addr) return alert("من فضلك اكتبي الاسم والعنوان");
  let t=0, m=`طلب جديد من موقع ${SHOP.name}\n\n`;
  cart.forEach(c=>{ const p=PRODUCTS[c.id]; t+=p.price*c.q; m+=`• ${p.name} (${c.size}) × ${c.q} = ${fmt(p.price*c.q)}\n`; });
  m+=`\nالإجمالي: ${fmt(t)}\nالاسم: ${name}\nالعنوان: ${addr}\nالدفع عند الاستلام`;
  window.open("https://wa.me/"+SHOP.phone+"?text="+encodeURIComponent(m),"_blank");
}

/* ---------- تشغيل ---------- */
(async()=>{ await load(); renderFilters(); renderGrid(); renderCart(); })();
</script>
</body>
</html>
